name: dddart_events_distributed
description: Distributed event system for DDDart that extends EventBus to enable domain events across network boundaries using HTTP polling.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  dddart:
  dddart_json:
  dddart_serialization:
  http: ^1.1.0
  logging: ^1.2.0
  shelf: ^1.4.0
  uuid: ^4.0.0

dev_dependencies:
  analyzer: ^8.4.1
  build: ^4.0.0
  build_runner: ^2.15.0
  build_test: ^3.3.2
  dddart_events_distributed_example:
    path: example/
  source_gen: ^4.2.3
  test: ^1.24.0
  very_good_analysis: ^6.0.0
