targets:
  $default:
    builders:
      # Runtime tests have no generated parts; generator tests supply source
      # fixtures directly to build_test. Do not resolve test-library metadata
      # merely to discover that it has no serialization inputs.
      dddart_json:json_serializable:
        generate_for: [lib/**, example/**]
      dddart_events_distributed:event_registry:
        enabled: true
        generate_for: [lib/**, example/**]

builders:
  event_registry:
    import: "package:dddart_events_distributed/src/generators/event_registry_generator.dart"
    builder_factories: ["eventRegistryBuilder"]
    build_extensions: {".dart": [".event_registry.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
