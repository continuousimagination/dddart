targets:
  $default:
    builders:
      # The identity fixture owns one combined part. Other tests provide source
      # fixtures to build_test. Only example/lib is an input: never scan nested
      # .dart_tool/cache files. One validation owner runs package/example builds
      # sequentially against the example combined part.
      dddart_json:json_serializable:
        generate_for: [lib/**, example/lib/**, test/identity_models.dart]
      dddart_events_distributed:event_registry:
        enabled: true
        generate_for: [lib/**, test/identity_models.dart]

builders:
  event_registry:
    import: "package:dddart_events_distributed/src/generators/event_registry_generator.dart"
    builder_factories: ["eventRegistryBuilder"]
    build_extensions: {".dart": [".event_registry.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
