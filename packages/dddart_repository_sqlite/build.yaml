targets:
  $default:
    builders:
      # Generate the fixture's combined part and handwritten library/example
      # inputs. Generator tests supply their own source through build_test;
      # unrelated test-library annotations are not generation inputs.
      dddart_json:json_serializable:
        generate_for: [lib/**, example/lib/**, test/test_models.dart]
      dddart_repository_sqlite:sqlite_repository:
        enabled: true
        generate_for: [lib/**, example/lib/**, test/test_models.dart]

builders:
  sqlite_repository:
    import: "package:dddart_repository_sqlite/src/generators/sqlite_repository_generator.dart"
    builder_factories: ["sqliteRepositoryBuilder"]
    build_extensions: {".dart": [".sqlite_repository.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
