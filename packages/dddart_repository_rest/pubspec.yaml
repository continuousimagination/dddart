name: dddart_repository_rest
description: REST API-backed repository implementation for DDDart aggregate roots with code generation support
version: 0.1.0
repository: https://github.com/continuousimagination/dddart
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  analyzer: ^8.4.1
  build: ^4.0.0
  dddart:
    resolution: workspace
  dddart_json:
    resolution: workspace
  dddart_rest_client:
    resolution: workspace
  dddart_serialization:
    resolution: workspace
  http: ^1.2.0
  source_gen: ^4.2.3

dev_dependencies:
  build_runner: ^2.15.0
  build_test: ^3.3.2
  dddart_rest:
    resolution: workspace
  dddart_shared_model_fixture:
    path: ../dddart_json/test/fixtures/shared_model
  shelf: ^1.4.0
  shelf_router: ^1.1.0
  test: ^1.24.0
  very_good_analysis: ^6.0.0
