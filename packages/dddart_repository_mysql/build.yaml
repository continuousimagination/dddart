targets:
  $default:
    builders:
      # Generate the fixture's combined part and handwritten library/example
      # inputs. Generator tests supply their own source through build_test;
      # unrelated test-library annotations are not generation inputs.
      dddart_json:json_serializable:
        generate_for: [lib/**, example/lib/**, test/integration_test_models.dart]
      dddart_repository_mysql:mysql_repository:
        enabled: true
        generate_for: [lib/**, example/lib/**, test/integration_test_models.dart]

builders:
  mysql_repository:
    import: "package:dddart_repository_mysql/src/generators/mysql_repository_generator.dart"
    builder_factories: ["mysqlRepositoryBuilder"]
    build_extensions: {".dart": [".mysql_repository.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]
