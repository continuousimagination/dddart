name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      unserviced: ${{ steps.matrix.outputs.unserviced }}
      mongo: ${{ steps.matrix.outputs.mongo }}
      dynamodb: ${{ steps.matrix.outputs.dynamodb }}
      mysql: ${{ steps.matrix.outputs.mysql }}
      example_unserviced: ${{ steps.matrix.outputs.example_unserviced }}
      example_mongo: ${{ steps.matrix.outputs.example_mongo }}
      example_dynamodb: ${{ steps.matrix.outputs.example_dynamodb }}
      example_mysql: ${{ steps.matrix.outputs.example_mysql }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Analyze validation tooling
        run: dart analyze --fatal-infos tool/validation

      - name: Check validation-tool formatting
        run: dart format --output=none --set-exit-if-changed tool/validation

      - name: Test validation policy
        run: dart tool/validation/self_test.dart

      - name: Check workspace inventory and dependency closures
        run: dart tool/validation/validate.dart check

      - name: Derive package and example matrices from shared inventory
        id: matrix
        shell: bash
        run: |
          echo "unserviced=$(dart tool/validation/validate.dart matrix --service-kind=none)" >> "$GITHUB_OUTPUT"
          echo "mongo=$(dart tool/validation/validate.dart matrix --service-kind=mongo)" >> "$GITHUB_OUTPUT"
          echo "dynamodb=$(dart tool/validation/validate.dart matrix --service-kind=dynamodb)" >> "$GITHUB_OUTPUT"
          echo "mysql=$(dart tool/validation/validate.dart matrix --service-kind=mysql)" >> "$GITHUB_OUTPUT"
          echo "example_unserviced=$(dart tool/validation/validate.dart example-matrix --service-kind=none)" >> "$GITHUB_OUTPUT"
          echo "example_mongo=$(dart tool/validation/validate.dart example-matrix --service-kind=mongo)" >> "$GITHUB_OUTPUT"
          echo "example_dynamodb=$(dart tool/validation/validate.dart example-matrix --service-kind=dynamodb)" >> "$GITHUB_OUTPUT"
          echo "example_mysql=$(dart tool/validation/validate.dart example-matrix --service-kind=mysql)" >> "$GITHUB_OUTPUT"

  packages:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.unserviced) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate integrated package
        run: >-
          dart tool/validation/validate.dart package
          "${{ matrix.name }}" --mode=ci

      - name: Validate isolated minimal consumer
        run: >-
          dart tool/validation/validate.dart consumer
          "${{ matrix.name }}"

  mongo-packages:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.mongo) }}
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate integrated package
        run: >-
          dart tool/validation/validate.dart package
          "${{ matrix.name }}" --mode=ci

      - name: Validate isolated minimal consumer
        run: >-
          dart tool/validation/validate.dart consumer
          "${{ matrix.name }}"

  dynamodb-packages:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.dynamodb) }}
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate integrated package
        run: >-
          dart tool/validation/validate.dart package
          "${{ matrix.name }}" --mode=ci

      - name: Validate isolated minimal consumer
        run: >-
          dart tool/validation/validate.dart consumer
          "${{ matrix.name }}"

  mysql-packages:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.mysql) }}
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate integrated package
        run: >-
          dart tool/validation/validate.dart package
          "${{ matrix.name }}" --mode=ci

      - name: Validate isolated minimal consumer
        run: >-
          dart tool/validation/validate.dart consumer
          "${{ matrix.name }}"

  examples:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.example_unserviced) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate example
        run: >-
          dart tool/validation/validate.dart example
          "${{ matrix.name }}" --mode=ci

  mongo-examples:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.example_mongo) }}
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate MongoDB example
        run: >-
          dart tool/validation/validate.dart example
          "${{ matrix.name }}" --mode=ci

  dynamodb-examples:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.example_dynamodb) }}
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate DynamoDB example
        run: >-
          dart tool/validation/validate.dart example
          "${{ matrix.name }}" --mode=ci

  mysql-examples:
    needs: inventory
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.example_mysql) }}
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd "mysqladmin ping -h localhost -ptest_password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.9.4

      - name: Cache Dart dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: dart-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            dart-${{ runner.os }}-

      - name: Resolve workspace dependencies
        run: dart pub get

      - name: Validate MySQL example
        run: >-
          dart tool/validation/validate.dart example
          "${{ matrix.name }}" --mode=ci
